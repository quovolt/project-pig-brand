<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="490" viewBox="0 0 1376 490" role="img" aria-labelledby="title desc">
<title id="title">3. Choose an inner idea and words — mission and sequence</title>
<desc id="desc">Choose an inner idea and supporting words. Read left to right: 1. Compare candidate meanings: Candidate themes, Current behavior and future ambitions, Relationships and tensions; 2. Express the inner idea: Working inner idea, Supporting internal words; 3. Explain the choice: Evidence and reasoning, Alternatives and trade-offs; 4. Review and revise: Review and revision. Next: connect with audience evidence. Return to abstraction when the meaning needs revision.</desc>
