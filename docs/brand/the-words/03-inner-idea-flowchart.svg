<title id="title">03-inner-idea mission and steps</title>
<desc id="desc">Choose an inner idea and supporting words. Steps: 1. Compare candidate meanings: Candidate themes, Current behavior and future ambitions, Relationships and tensions; 2. Express the inner idea: Working inner idea, Supporting internal words; 3. Explain the choice: Evidence and reasoning, Alternatives and trade-offs; 4. Review and revise: Review and revision. Next: connect with audience evidence. Return to abstraction when the meaning needs revision.</desc>
