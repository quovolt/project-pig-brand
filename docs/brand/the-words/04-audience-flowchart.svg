<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="490" viewBox="0 0 1376 490" role="img" aria-labelledby="title desc">
<title id="title">4. Research the audience — mission and sequence</title>
<desc id="desc">Understand audience needs, context and language. Read left to right: 1. Frame the research: Research questions and assumptions, Audience and situations; 2. Explore the audience world: Needs, concerns and alternatives, Audience language; 3. Weigh the research: Research sources and observations, Findings and limitations; 4. Connect and investigate further: Connections to the inner idea, Open questions and further research. Next: positioning, alongside the inner idea. Run in parallel with internal meaning; revisit assumptions.</desc>
