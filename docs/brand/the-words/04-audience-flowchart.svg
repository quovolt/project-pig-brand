<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1094" viewBox="0 0 560 1094" role="img" aria-labelledby="title desc">
<title id="title">04-audience mission and steps</title>
<desc id="desc">Understand audience needs, context and language. Steps: 1. Frame the research: Research questions and assumptions, Audience and situations; 2. Explore the audience world: Needs, concerns and alternatives, Audience language; 3. Weigh the research: Research sources and observations, Findings and limitations; 4. Connect and investigate further: Connections to the inner idea, Open questions and further research. Next: positioning, alongside the inner idea. Run in parallel with internal meaning; revisit assumptions.</desc>
