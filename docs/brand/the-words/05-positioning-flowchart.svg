<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1068" viewBox="0 0 560 1068" role="img" aria-labelledby="title desc">
<title id="title">05-positioning mission and steps</title>
<desc id="desc">Connect inner meaning with credible audience value. Steps: 1. Bring the evidence together: Inner idea and audience evidence, Audience and context; 2. Explore value and alternatives: Value and relevance, Alternatives and differentiation; 3. Form credible hypotheses: Capabilities and reasons to believe, Positioning hypotheses; 4. Choose and plan tests: Trade-offs and selection reasoning, Assumptions to test. Next: outward expression. Return to audience or capability evidence when needed.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52718c"/></marker></defs>
