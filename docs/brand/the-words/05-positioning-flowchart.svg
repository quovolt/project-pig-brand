<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="522" viewBox="0 0 1376 522" role="img" aria-labelledby="title desc">
<title id="title">5. Define positioning — mission and sequence</title>
<desc id="desc">Connect inner meaning with credible audience value. Read left to right: 1. Bring the evidence together: Inner idea and audience evidence, Audience and context; 2. Explore value and alternatives: Value and relevance, Alternatives and differentiation; 3. Form credible hypotheses: Capabilities and reasons to believe, Positioning hypotheses; 4. Choose and plan tests: Trade-offs and selection reasoning, Assumptions to test. Next: outward expression. Return to audience or capability evidence when needed.</desc>
