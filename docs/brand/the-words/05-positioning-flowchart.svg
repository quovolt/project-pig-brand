<rect x="42" y="32" width="476" height="118" rx="12" fill="#173552" stroke="#173552"/>
<text x="280" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#c5dfef">MISSION</text>
<text x="280" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="white">Connect inner meaning with credible</text>
<text x="280" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="white">audience value.</text>
