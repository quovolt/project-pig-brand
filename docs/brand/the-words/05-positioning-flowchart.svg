<text x="280" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#173552">Inner idea and audience evidence</text>
<text x="280" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#173552">Audience and context</text>
<path d="M280,329 V359" fill="none" stroke="#52718c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="367" width="476" height="137" rx="12" fill="#edf4fa" stroke="#bacbdc"/>
<text x="280" y="399" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#173552">2. Explore value and alternatives</text>
<text x="280" y="436" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#173552">Value and relevance</text>
<text x="280" y="461" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#173552">Alternatives and differentiation</text>
<path d="M280,506 V536" fill="none" stroke="#52718c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="544" width="476" height="137" rx="12" fill="#edf4fa" stroke="#bacbdc"/>
<text x="280" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#173552">3. Form credible hypotheses</text>
<text x="280" y="613" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#173552">Capabilities and reasons to believe</text>
<text x="280" y="638" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#173552">Positioning hypotheses</text>
<path d="M280,683 V713" fill="none" stroke="#52718c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="721" width="476" height="137" rx="12" fill="#edf4fa" stroke="#bacbdc"/>
<text x="280" y="753" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#173552">4. Choose and plan tests</text>
