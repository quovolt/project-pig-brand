<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="538" viewBox="0 0 1376 538" role="img" aria-labelledby="title desc">
<title id="title">1. Prepare group material — mission and sequence</title>
<desc id="desc">Gather concrete material for abstraction. Read left to right: 1. Frame the collection: Purpose and scope; 2. Gather experiences and ambitions: Origins and shared experiences, Actions, decisions and trade-offs, Ambitions and open questions; 3. Check the evidence: Sources and evidence, Contradictions and limitations; 4. Select the material: Material selected for abstraction. Next: abstraction. Return when evidence is missing or unclear.</desc>
