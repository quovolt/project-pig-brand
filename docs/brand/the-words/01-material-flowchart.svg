<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1020" viewBox="0 0 560 1020" role="img" aria-labelledby="title desc">
<title id="title">01-material mission and steps</title>
<desc id="desc">Gather concrete material for abstraction. Steps: 1. Frame the collection: Purpose and scope; 2. Gather experiences and ambitions: Origins and shared experiences, Actions, decisions and trade-offs, Ambitions and open questions; 3. Check the evidence: Sources and evidence, Contradictions and limitations; 4. Select the material: Material selected for abstraction. Next: abstraction. Return when evidence is missing or unclear.</desc>
