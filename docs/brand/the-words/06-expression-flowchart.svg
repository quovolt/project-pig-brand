<title id="title">6. Transform into outward language — mission and sequence</title>
<desc id="desc">Turn the chosen meaning into outward language. Read left to right: 1. Set the expression context: Inner idea and positioning, Audience language and expression context; 2. Explore language and directions: Transformation approaches, Candidate words and messages, Alternative directions; 3. Trace and compare the choices: Connections to meaning and evidence, Comparison and selection reasoning; 4. Prepare questions for testing: Risks and questions for testing. Next: application and testing. Return to positioning if the promise or meaning changes.</desc>
