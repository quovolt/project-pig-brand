<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1196" viewBox="0 0 560 1196" role="img" aria-labelledby="title desc">
<title id="title">07-testing mission and steps</title>
<desc id="desc">Learn from real use and decide what to revise. Steps: 1. Prepare applications and tests: Candidate directions and versions, Real contexts and touchpoints, Test questions and methods; 2. Check meaning, credibility and use: Internal authenticity, Credibility in practice, Audience understanding and relevance, Application results; 3. Interpret feedback and decide: Feedback and interpretation, Decisions and revision paths; 4. Record versions and open questions: Version history and unresolved questions. Next: revise the relevant earlier step. Feedback can change expression, meaning or positioning.</desc>
