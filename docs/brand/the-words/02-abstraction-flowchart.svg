<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="490" viewBox="0 0 1376 490" role="img" aria-labelledby="title desc">
<title id="title">2. Abstract the material — mission and sequence</title>
<desc id="desc">Derive candidate meanings from concrete material. Read left to right: 1. Observe the material: Source material, Observations; 2. Explore possible meanings: Possible interpretations, Comparison and grouping; 3. Compare themes and alternatives: Candidate themes and words, Alternative interpretations and counterexamples; 4. Choose and question: Selection and reasoning, Questions for further evidence. Next: inner idea. Return to material when an interpretation lacks support.</desc>
