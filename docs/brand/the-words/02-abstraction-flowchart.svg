<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1093" viewBox="0 0 560 1093" role="img" aria-labelledby="title desc">
<title id="title">02-abstraction mission and steps</title>
<desc id="desc">Derive candidate meanings from concrete material. Steps: 1. Observe the material: Source material, Observations; 2. Explore possible meanings: Possible interpretations, Comparison and grouping; 3. Compare themes and alternatives: Candidate themes and words, Alternative interpretations and counterexamples; 4. Choose and question: Selection and reasoning, Questions for further evidence. Next: inner idea. Return to material when an interpretation lacks support.</desc>
