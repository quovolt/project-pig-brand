<text x="280" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="white">Derive candidate meanings from</text>
<text x="280" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="white">concrete material.</text>
